# next dev must not block on an install: node_modules is a named volume the
# container entrypoint owns, and these containers have no outbound network.
# Install deliberately instead: docker compose exec <svc> pnpm install
verifyDepsBeforeRun: false
allowBuilds:
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@hugeicons/core-free-icons@4.2.3'
  - '@hugeicons/react@1.1.9'
  - '@base-ui/react@1.7.0'
  - '@base-ui/utils@0.3.2'
  - '@next/env@16.3.0'
  - '@next/eslint-plugin-next@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - eslint-config-next@16.3.0
  - next@16.3.0
